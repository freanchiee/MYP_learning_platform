s."},2:{keywords:["strong","electrostatic","forces","attraction","ions","energy","break","lattice","giant"],excellent:"Outstanding! You explained the strong forces in the giant lattice and the energy needed to break them.",good:"Good work! Your explanation covers the main points about bonding strength.",medium:"You have the right idea. Expand on why the forces are strong and their effect on melting point.",poor:"Try to explain the forces between ions and why they require high temperatures to overcome.",exemplar:"Ionic compounds have high melting and boiling points because of the strong electrostatic forces of attraction between oppositely charged ions in the giant lattice structure. A large amount of energy is required to overcome these strong forces and separate the ions."},3:{keywords:["molten","aqueous","ions","free","move","solid","fixed","lattice","positions","conduct"],excellent:"Perfect! You clearly explained that ions need to be free to move to conduct electricity.",good:"Good answer! You understand the key concept about ion mobility.",medium:"You have the right idea. Be more specific about when ions can and cannot move.",poor:"Focus on the difference between solid (ions fixed) and molten/aqueous (ions free to move).",exemplar:"When molten or aqueous, the ions are free to move and can carry electrical charge through the substance. When solid, the ions are fixed in position in the lattice structure and cannot move to conduct electricity."},4:{keywords:["magnesium","loses","two","electrons","mg2+","oxygen","gains","o2-","2,8","stable"],excellent:"Excellent! You correctly described both ion formations with configurations.",good:"Good! You covered the main points about electron transfer.",medium:"Decent attempt. Include specific electron configurations for both ions.",poor:"Describe how many electrons are transferred and the final configurations of both ions.",exemplar:"Magnesium loses 2 electrons to form Mg\xB2\u207A with electronic configuration 2,8. Oxygen gains 2 electrons to form O\xB2\u207B with configuration 2,8. The ionic bond forms due to strong electrostatic attraction between the ions in MgO."}},2:{1:{keywords:["share","pair","electrons","hydrogen","stable","noble gas","helium"],excellent:"Excellent! You described electron sharing and achieving stable configurations.",good:"Good work! You understand the key concept of electron sharing.",medium:"You have the basic idea. Add more about why this creates a stable molecule.",poor:"Focus on the sharing of electrons and how this makes both atoms stable.",exemplar:"Each hydrogen atom has 1 electron. They share a pair of electrons (one from each), forming a covalent bond. By sharing, each hydrogen achieves 2 electrons, giving it the stable configuration of helium."},2:{keywords:["weak","intermolecular","forces","between","molecules","little","energy","low","overcome"],excellent:"Perfect! You distinguished between strong covalent bonds within molecules and weak forces between them.",good:"Good explanation! You understand about intermolecular forces.",medium:"You're on the right track. Clarify the difference between bonds within and forces between molecules.",poor:"Explain that weak forces between molecules need little energy to overcome.",exemplar:"Simple molecular compounds have low boiling points because there are only weak intermolecular forces between molecules. These require little energy to overcome. The strong covalent bonds within molecules don't break during boiling."},3:{keywords:["carbon","four","hydrogen","single","covalent","bonds","share","eight","electrons","stable"],excellent:"Excellent! You described all four bonds and explained stability.",good:"Good work! You understand the bonding in methane.",medium:"Decent answer. Be more specific about the number of bonds and electron sharing.",poor:"Describe how many bonds carbon forms with hydrogen and why this is stable.",exemplar:"In methane (CH\u2084), carbon forms four single covalent bonds - one with each hydrogen. Carbon shares one electron with each hydrogen. This gives carbon 8 outer electrons (like neon) and each hydrogen 2 electrons (like helium)."},4:{keywords:["single","pair","double","four","triple","six","electrons","shared"],excellent:"Perfect! You explained all three bond types with correct electron numbers.",good:"Good explanation! You understand the different bond types.",medium:"You have the basic idea. Include specific numbers of shared electrons.",poor:"Explain how many electrons are shared in each type and give examples.",exemplar:"A single bond has 2 electrons shared (e.g., H\u2082). A double bond has 4 electrons shared (e.g., O\u2082). A triple bond has 6 electrons shared (e.g., N\u2082). Multiple bonds are stronger."}},3:{1:{keywords:["carbon","four","covalent","bonds","tetrahedral","giant","three","dimensional","lattice","strong","rigid"],excellent:"Excellent! You described the 3D structure and related it to hardness.",good:"Good work! You understand diamond's structure.",medium:"You have the right idea. Explain more about the three-dimensional bonding.",poor:"Describe the giant lattice with four bonds per carbon and why this makes it hard.",exemplar:"Diamond has a giant covalent structure where each carbon forms four strong covalent bonds in a tetrahedral arrangement. This creates a rigid 3D lattice. All bonds are strong, making diamond extremely hard."},2:{keywords:["graphite","delocalized","electrons","free","move","conduct","diamond","no","all","bonding"],excellent:"Perfect! You explained the key difference - delocalized electrons in graphite.",good:"Good explanation! You understand about electron mobility.",medium:"You're on the right track. Be more specific about delocalized electrons.",poor:"Explain that graphite has delocalized electrons that can move, while diamond doesn't.",exemplar:"Graphite conducts electricity because each carbon only forms three covalent bonds, leaving one electron per carbon delocalized. These electrons are free to move and carry charge. Diamond has all electrons in bonding, so no free electrons."},3:{keywords:["layers","weak","forces","between","slide","over","slippery","hexagonal"],excellent:"Excellent! You clearly linked the layer structure to lubricant properties.",good:"Good work! You understand the structure-property relationship.",medium:"You have the basic idea. Explain more about how layers can slide.",poor:"Describe the layer structure and weak forces that allow layers to slide.",exemplar:"Graphite has layers of hexagonal carbon rings. Within layers are strong covalent bonds, but only weak forces between layers. These weak forces allow layers to slide easily, making graphite slippery - ideal as a lubricant."},4:{keywords:["giant","covalent","structure","similar","three","dimensional","strong","bonds","hard","high"],excellent:"Perfect! You identified the similar giant covalent structures.",good:"Good answer! You understand the structural similarity.",medium:"You're on the right path. Be more specific about the type of structure.",poor:"Explain that both have giant covalent structures with atoms bonded throughout.",exemplar:"Silicon(IV) oxide has a giant covalent structure like diamond - a 3D lattice with strong covalent bonds throughout. This makes it very hard with a very high melting point, just like diamond."}},4:{1:{keywords:["positive","ions","lattice","sea","delocalized","electrons","electrostatic","attraction"],excellent:"Excellent! You described the structure with positive ions and delocalized electrons.",good:"Good work! You understand metallic bonding.",medium:"You have the basic idea. Include more detail about the sea of electrons.",poor:"Describe the giant lattice of positive ions and the delocalized electrons.",exemplar:"Metallic bonding is the electrostatic attraction between positive metal ions arranged in a giant lattice and a sea of delocalized electrons that can move freely throughout the structure."},2:{keywords:["delocalized","electrons","free","move","carry","charge","current","conduct"],excellent:"Perfect! You explained how delocalized electrons enable conductivity.",good:"Good explanation! You understand the role of electrons.",medium:"You're on the right track. Be more specific about electron movement.",poor:"Explain that free electrons can move and carry electrical charge.",exemplar:"Metals conduct electricity well because they have delocalized electrons that are free to move throughout the structure. When voltage is applied, these electrons flow, carrying electric current."},3:{keywords:["layers","ions","slide","electrons","move","bonding","maintained","no","bonds","broken"],excellent:"Excellent! You explained how layers can slide while maintaining bonding.",good:"Good work! You understand malleability.",medium:"You have the right idea. Explain why bonds don't break.",poor:"Describe how ions can move while the sea of electrons maintains bonding.",exemplar:"Metals are malleable because layers of ions can slide over each other. The sea of delocalized electrons moves with them, maintaining metallic bonding throughout. No bonds are broken - they just reform in new positions."},4:{keywords:["metals","delocalized","electrons","free","solid","ionic","ions","fixed","cannot"],excellent:"Perfect! You explained the difference in charged particle mobility.",good:"Good answer! You understand the key distinction.",medium:"You're on the right track. Be more specific about particle movement.",poor:"Explain that metals have free electrons but ionic compounds have fixed ions when solid.",exemplar:"Metals conduct when solid because delocalized electrons are free to move. Ionic compounds cannot conduct when solid because ions are fixed in lattice positions and cannot move to carry charge."}},5:{1:{keywords:["giant","covalent","diamond","silicon","very high","melting","no","conduct","electrons","bonding"],excellent:"Excellent! You correctly identified giant covalent bonding and explained your reasoning.",good:"Good work! You

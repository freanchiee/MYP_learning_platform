d time something. What path does the sound take?",points:25}],[{type:"mcq",question:"When drawing ray diagrams for plane mirrors, the angle of incidence is:",options:["Always 90 degrees","Equal to the angle of reflection","Greater than the angle of reflection","Half of the angle of reflection"],correct:1,hint:"Think about the law of reflection - what relationship exists between these two angles?",points:10},{type:"written",question:"Describe what happens to a light ray when it passes from air into water. Include the terms: normal, refraction, and speed.",keywords:["bends","towards","normal","slows","refraction","speed","decreases"],keywordVariations:{bends:["bend","changes direction","deflects"],towards:["toward","closer to"],slows:["slow down","slower","reduces"],decreases:["decrease","reduced"]},exemplar:"When light passes from air into water, it bends towards the normal. This is called refraction. The light ray bends because it slows down - the speed of light decreases in the denser medium (water).",hint:"Think about what happens when light enters a denser medium. Does it speed up or slow down? How does this affect its direction?",points:20},{type:"written",question:"A light ray hits a mirror at 30\xB0 to the normal. At what angle does it reflect? Explain the law you used.",keywords:["30","degrees","law of reflection","equal","angle of incidence","angle of reflection"],keywordVariations:{30:["thirty","30\xB0"],equal:["same","equals","="],"law of reflection":["reflection law","law"]},exemplar:"The light ray reflects at 30\xB0 to the normal. According to the law of reflection, the angle of incidence equals the angle of reflection. Since the incident ray is at 30\xB0, the reflected ray is also at 30\xB0 to the normal.",hint:"There is a fundamental law about reflection that relates these two angles. They have a special relationship.",points:20}],[{type:"mcq",question:"Which application of electromagnetic waves raises the MOST ethical concerns about privacy?",options:

ial documents"]},{id:"strand2",title:"Strand ii: Discuss Environmental Impact",subtitle:"Analyze how toiletry production and use affects the environment",icon:xl,color:"bg-green-500",keywords:["pollution","waste","plastic","packaging","chemicals","aquatic","ecosystem","sustainability","carbon footprint","biodegradable"],concepts:["environmental consequence","water pollution","plastic waste","chemical disposal","ecological impact"],task:"Discuss the environmental impacts of your chosen toiletry product - both positive and negative.",tips:["Consider the ENTIRE lifecycle: production \u2192 use \u2192 disposal","Include specific environmental issues (water pollution, plastic waste, etc.)","Discuss both negative impacts AND sustainable alternatives","Use evidence from the sources provided"],exemplar:'Level 7-8 Example: "Liquid shampoos contribute to plastic pollution through single-use bottles, with millions entering landfills annually. During manufacturing, chemical surfactants like sodium lauryl sulfate can enter water systems, affecting aquatic ecosystems. However, shampoo bars offer a sustainable alternative: they eliminate plastic packaging, reduce shipping emissions due to compact size, and use biodegradable ingredients. The shift to bars demonstrates how consumer choices can reduce environmental footprints while maintaining product effectiveness."',hints:["Think: production waste, packaging, chemicals in waterways, transport emissions","What happens when the product goes down the drain?","Are there eco-friendly alternatives mentioned in the sources?"]},{id:"strand3",title:"Strand iii: Social, Economic & Ethical Implications",subtitle:"Evaluate the broader impacts on society and ethical concerns",icon:Ll,color:"bg-yellow-500",keywords:["advertising","misleading","claims","body image","marketing","consumer","economic","cost","accessibility","ethical"],concepts:["misleading advertising","beauty standards","consumer behavior","economic impact","ethical sourcing","health claims"],task:"Discuss the social, economic, OR ethical implications of your toiletry product. Choose at least TWO aspects.",tips:["Social: beauty standards, gender norms, advertising effects, health misconceptions","Economic: cost to consumers, market trends, job creation, brand competition","Ethical: misleading claims, ingredient sourcing, animal testing, cultural appropriation","Use specific examples from the ASA guidelines and research articles"],exemplar:'Level 7-8 Example: "Hair care advertising raises significant ethical concerns. The ASA prohibits "repair" claims unless supported by robust evidence, yet many brands use scientific-sounding language to mislead consumers. This creates unrealistic expectations and wastes consumer money on ineffective products. Socially, male grooming advertisements construct new masculinity ideals, pressuring men to purchase skincare products to meet beautified standards. Economically, the shift to shampoo bars supports small artisanal businesses and local economies, creating jobs in sustainable ingredient sourcing, though it challenges established brands to adapt or lose market share."',hints:["Look at the ASA advertising guidelines - what claims are problematic?","Consider: Who benefits? Who is harmed? What pressures exist?",'Think about the "beautification" article and economic impact sources']},{id:"strand4",title:"Strand iv: Personal Opinion with Justification",subtitle:"Should consumers prioritize natural or synthetic toiletries?",icon:va,color:"bg-red-500",keywords:["opinion","justify","balance","perspective","recommend","depends","consider","however","although"],concepts:["balanced argument","evidence-based opinion","counterargument","reasoned conclusion"],task:"Give your informed opinion: Should consumers choose natural or synthetic toiletry products? Justify using scientific evidence.",tips:["State your position clearly","Provide 2-3 scientific reasons supporting your view","Acknowledge the opposing perspective (counterargument)","Use evidence from sources to support claims","End with a nuanced conclusion"],exemplar:'Level 7-8 Example: "Consumers should prioritize products based on sustainability and safety rather than the natural/synthetic distinction alone. While natural fragrances appeal emotionally as "authentic," they require intensive plant harvesting, threatening biodiversity and having shorter shelf lives. Synthetic fragrances offer consistency, cost-effectiveness, and reduce pressure on wild plant populations. However, some synthetics like phthalates pose health risks. The optimal approach is bioengineered synthetics, which combine sustainability benefits with safety profiles. Ultimately, consumers should examine evidence for specific products rather than assuming all natural products are superior or all synthetic products are harmful."',hints:[`There's no single "right" answer - it's about quality of reasoning`,"Use the natural vs synthetic fragrance comparison article","Show you understand BOTH sides before concluding"]}],C=(i,p)=>{if(!p.keywords)return{keywords:0,concepts:0,phrases:0};let I=i.toLowerCase(),w=p.keywords.filter(_=>I.includes(_.toLowerCase())).length,k=p.concepts.filter(_=>I.includes(_.toLowerCase())).length,P=(I.length>300?1:0)+(I.split(".").length>4?1:0);return{keywords:Math.min(w/p.keywords.length*100,100),concepts:Math.min(k/p.concepts.length*100,100),phrases:Math.min(P/2*100,100)}};(0,be.useEffect)(()=>{let i=m[e];if(i.id!=="intro"&&t[i.id]){let p=C(t[i.id],i);c(I=>({...I,[i.id]:p})),p.keywords>=60&&!u.includes(`${i.id}-keywords`)&&n(I=>[...I,`${i.id}-keywords`]),p.concepts>=75&&!u.includes(`${i.id}-concepts`)&&n(I=>[...I,`${i.id}-concepts`])}},[t,e]);let S=(i,p)=>{l(I=>({...I,[i]:p}))},y=i=>{o(p=>({...p,[i]:!p[i]}))},B=()=>{let i=`

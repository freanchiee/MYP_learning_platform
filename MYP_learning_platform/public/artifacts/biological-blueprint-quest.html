<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Biological Blueprint — MYP Y9 Classification Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#08172a;
  --bg-deep:#050f1d;
  --panel:#0d2136;
  --panel-2:#0f2740;
  --grid-line:rgba(120,185,235,0.07);
  --grid-line-strong:rgba(120,185,235,0.14);
  --hair:#20415e;
  --hair-soft:#173650;
  --cyan:#5AD1FF;
  --cyan-dim:#2F7EA3;
  --green:#6EE7A8;
  --green-dim:#2E9166;
  --amber:#F2B84B;
  --amber-dim:#a97f2b;
  --coral:#FF7A7A;
  --coral-dim:#9c3f3f;
  --ink:#EAF3FB;
  --ink-dim:#8FAFC9;
  --ink-faint:#5C7C97;
  --radius-s:4px;
  --radius-m:8px;
  --font-display:'Fraunces', 'Iowan Old Style', 'Georgia', serif;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
}
:root[data-theme="dark"]{ --bg:#08172a; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#08172a; }
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:28px 28px;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(90,209,255,0.08), transparent 60%),
             radial-gradient(ellipse 700px 500px at 100% 10%, rgba(110,231,168,0.06), transparent 60%);
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,h4{ font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink); }
p{ margin:0 0 .8em; color:var(--ink-dim); }
p:last-child{ margin-bottom:0; }
.sp{ font-style:italic; font-family:var(--font-display); color:var(--ink); }
.mono{ font-family:var(--font-mono); }
a{ color:var(--cyan); }
button{ font-family:inherit; }
::selection{ background:var(--cyan); color:#04111e; }
.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* =========================================================
   LAYOUT SHELL
   ========================================================= */
#app{ position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:0 18px 80px; }
.skip-link{ position:absolute; left:-999px; top:0; background:var(--cyan); color:#04111e; padding:8px 14px; z-index:999; }
.skip-link:focus{ left:12px; top:12px; }

/* header / HUD */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:14px 4px 12px;
  background:linear-gradient(var(--bg) 78%, transparent);
  backdrop-filter:blur(2px);
}
.brand{ display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:0; }
.brand:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }
.brand-name{ font-family:var(--font-mono); font-size:11px; letter-spacing:.04em; color:var(--ink-dim); line-height:1.2; text-align:left; }
.brand-name b{ color:var(--ink); display:block; font-size:12px; }
.topbar-spacer{ flex:1; }
.hud{ display:flex; align-items:center; gap:10px; }
.hud-chip{
  display:flex; align-items:center; gap:7px;
  border:1px solid var(--hair); border-radius:999px;
  padding:6px 12px 6px 8px; background:var(--panel);
  font-family:var(--font-mono); font-size:12.5px; color:var(--ink);
  white-space:nowrap;
}
.hud-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); }
.hud-rank{ display:none; }
@media(min-width:600px){ .hud-rank{ display:flex; } }
.icon-btn{
  border:1px solid var(--hair); background:var(--panel); color:var(--ink-dim);
  border-radius:999px; width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:border-color .15s, color .15s;
}
.icon-btn:hover{ border-color:var(--cyan); color:var(--cyan); }
.icon-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

/* corner reticle — signature decorative device echoing the source blueprint */
.reticle{ position:relative; }
.reticle::before,.reticle::after,
.reticle .rt-br,.reticle .rt-bl{ display:none; }
.plate{
  position:relative;
  border:1px solid var(--hair);
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border-radius:var(--radius-m);
}
.plate::before,.plate::after{
  content:""; position:absolute; width:14px; height:14px; pointer-events:none;
  border-color:var(--cyan-dim);
}
.plate::before{ top:-1px; left:-1px; border-top:1px solid; border-left:1px solid; }
.plate::after{ bottom:-1px; right:-1px; border-bottom:1px solid; border-right:1px solid; }
.plate .rt2{ content:""; position:absolute; top:-1px; right:-1px; width:14px; height:14px; border-top:1px solid var(--hair); border-right:1px solid var(--hair); }
.plate .rt3{ content:""; position:absolute; bottom:-1px; left:-1px; width:14px; height:14px; border-bottom:1px solid var(--hair); border-left:1px solid var(--hair); }

/* =========================================================
   PRIMITIVES
   ========================================================= */
.panel{ padding:20px; margin-bottom:16px; }
.panel-tight{ padding:14px 16px; }
.eyebrow-tag{
  display:inline-flex; align-items:center; gap:6px;
  font-family:var(--font-mono); font-size:11px; color:var(--cyan);
  border:1px solid var(--cyan-dim); border-radius:999px; padding:3px 10px 3px 8px;
  margin-bottom:10px;
}
.eyebrow-tag .dot{ width:5px; height:5px; border-radius:50%; background:var(--cyan); }
.section-title{ font-size:22px; margin-bottom:4px; }
.section-sub{ color:var(--ink-dim); font-size:14.5px; margin-bottom:0; }

.btn{
  font-family:var(--font-body); font-weight:600; font-size:14.5px;
  border-radius:var(--radius-s); border:1px solid var(--hair);
  padding:10px 18px; cursor:pointer; background:var(--panel-2); color:var(--ink);
  transition:transform .12s, border-color .15s, background .15s;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{ border-color:var(--cyan); }
.btn:active{ transform:scale(.97); }
.btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }
.btn-primary{ background:linear-gradient(180deg,#3fbde8,#1c8fb8); border-color:#1c8fb8; color:#04111e; }
.btn-primary:hover{ border-color:#8fe4ff; }
.btn-ghost{ background:transparent; }
.btn-sm{ padding:6px 12px; font-size:13px; }
.btn-block{ width:100%; justify-content:center; }

.divider{ height:1px; background:var(--hair-soft); margin:18px 0; border:none; }
.callout{
  border:1px solid var(--hair); border-left:3px solid var(--cyan);
  background:var(--panel-2); padding:12px 14px; border-radius:0 var(--radius-s) var(--radius-s) 0;
  font-size:14.5px; margin:14px 0;
}
.callout.amber{ border-left-color:var(--amber); }
.callout.green{ border-left-color:var(--green); }
.callout b{ color:var(--ink); }

.measure-chip{
  display:inline-flex; align-items:baseline; gap:4px;
  font-family:var(--font-mono); background:var(--bg-deep); border:1px solid var(--hair);
  border-radius:var(--radius-s); padding:2px 8px; font-size:13px; color:var(--cyan);
}

/* progress bar */
.pbar{ height:7px; border-radius:99px; background:var(--bg-deep); border:1px solid var(--hair); overflow:hidden; }
.pbar > div{ height:100%; background:linear-gradient(90deg, var(--green), var(--cyan)); transition:width .5s ease; }

/* =========================================================
   QUEST MAP (home)
   ========================================================= */
.hero{ padding:34px 22px 30px; margin-bottom:22px; text-align:left; }
.hero h1{ font-size:clamp(28px,5vw,40px); line-height:1.08; max-width:640px; }
.hero .hero-kicker{ font-family:var(--font-mono); color:var(--green); font-size:12.5px; letter-spacing:.03em; margin-bottom:10px; display:block; }
.hero p.lead{ max-width:520px; margin-top:12px; font-size:15.5px; }
.hero-scale{ position:absolute; top:22px; right:22px; text-align:right; font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); display:none; }
@media(min-width:720px){ .hero-scale{ display:block; } }

.questmap{ position:relative; padding:26px 18px 10px; }
.qm-track{ position:relative; }
.qm-node-row{ position:relative; display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); }
.qm-node{
  position:relative; border:1px solid var(--hair); background:var(--panel-2);
  border-radius:var(--radius-m); padding:16px 14px 14px; cursor:pointer; text-align:left;
  transition:border-color .15s, transform .12s; color:inherit;
}
.qm-node:hover{ border-color:var(--cyan); transform:translateY(-2px); }
.qm-node:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.qm-node[data-locked="true"]{ opacity:.5; cursor:not-allowed; }
.qm-node[data-locked="true"]:hover{ transform:none; border-color:var(--hair); }
.qm-num{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
.qm-icon{ width:34px; height:34px; margin:6px 0 10px; }
.qm-title{ font-size:16px; font-weight:600; color:var(--ink); margin-bottom:3px; }
.qm-sub{ font-size:12px; color:var(--ink-dim); min-height:30px; }
.qm-stars{ display:flex; gap:3px; margin-top:10px; }
.qm-stars svg{ width:14px; height:14px; }
.qm-lock{ position:absolute; top:12px; right:12px; width:16px; height:16px; color:var(--ink-faint); }
.qm-node[data-complete="true"]{ border-color:var(--green-dim); }

/* =========================================================
   LEVEL SHELL
   ========================================================= */
.level-head{ padding:22px; margin-bottom:18px; }
.level-head .tag{ font-family:var(--font-mono); color:var(--cyan); font-size:12px; }
.level-head h2{ font-size:26px; margin:6px 0 8px; }
.level-progress-row{ display:flex; align-items:center; gap:12px; margin-top:14px; }
.level-progress-row .pbar{ flex:1; }
.level-progress-row span{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); white-space:nowrap; }

.diagram-panel{ padding:20px; }
.diagram-panel h3{ font-size:15px; margin-bottom:12px; color:var(--cyan); }
.kv-table{ width:100%; border-collapse:collapse; font-size:14px; }
.kv-table th{ text-align:left; font-family:var(--font-mono); font-weight:500; font-size:11.5px; color:var(--ink-faint); padding:6px 10px; border-bottom:1px solid var(--hair); }
.kv-table td{ padding:8px 10px; border-bottom:1px solid var(--hair-soft); vertical-align:top; }
.kv-table tr:last-child td{ border-bottom:none; }

/* =========================================================
   QUESTIONS: MCQ
   ========================================================= */
.q-block{ padding:18px 18px 20px; margin-bottom:14px; }
.q-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px; }
.q-num{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-bottom:4px; display:block; }
.q-prompt{ font-size:15.5px; color:var(--ink); font-weight:500; }
.q-xp{ font-family:var(--font-mono); font-size:11px; color:var(--amber); border:1px solid var(--amber-dim); border-radius:999px; padding:3px 9px; white-space:nowrap; }
.opts{ display:grid; gap:8px; margin-top:4px; }
.opt{
  text-align:left; border:1px solid var(--hair); background:var(--panel-2); color:var(--ink);
  padding:11px 14px; border-radius:var(--radius-s); cursor:pointer; font-size:14.5px;
  display:flex; align-items:center; gap:10px; transition:border-color .12s, background .12s;
}
.opt:hover:not([disabled]){ border-color:var(--cyan); }
.opt:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.opt .letter{ font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); border:1px solid var(--hair); border-radius:4px; width:20px; height:20px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.opt[disabled]{ cursor:default; }
.opt.correct{ border-color:var(--green); background:rgba(110,231,168,0.08); }
.opt.correct .letter{ border-color:var(--green); color:var(--green); }
.opt.wrong{ border-color:var(--coral); background:rgba(255,122,122,0.08); }
.opt.wrong .letter{ border-color:var(--coral); color:var(--coral); }
.opt.dim{ opacity:.55; }
.q-feedback{ margin-top:10px; font-size:13.5px; padding:10px 12px; border-radius:var(--radius-s); display:none; }
.q-feedback.show{ display:block; }
.q-feedback.ok{ background:rgba(110,231,168,0.08); border:1px solid var(--green-dim); color:var(--ink); }
.q-feedback.no{ background:rgba(255,122,122,0.08); border:1px solid var(--coral-dim); color:var(--ink); }

/* =========================================================
   SHORT ANSWER + LIVE KEYWORD / LEVEL BAND
   ========================================================= */
.sa-wrap textarea{
  width:100%; min-height:96px; resize:vertical; background:var(--bg-deep); color:var(--ink);
  border:1px solid var(--hair); border-radius:var(--radius-s); padding:12px; font-family:var(--font-body);
  font-size:14.5px; line-height:1.5;
}
.sa-wrap textarea:focus{ outline:none; border-color:var(--cyan); }
.sa-wrap textarea[disabled]{ opacity:.65; }
.sa-meta{ display:flex; align-items:center; justify-content:space-between; margin-top:8px; flex-wrap:wrap; gap:8px; }
.kw-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.kw-chip{
  font-family:var(--font-mono); font-size:11.5px; padding:4px 9px; border-radius:999px;
  border:1px solid var(--hair); color:var(--ink-faint); transition:border-color .2s, color .2s, background .2s;
}
.kw-chip.hit{ border-color:var(--green); color:var(--green); background:rgba(110,231,168,0.08); }
.band-badge{
  font-family:var(--font-mono); font-size:12px; padding:5px 11px; border-radius:999px; border:1px solid var(--hair);
  color:var(--ink-dim); white-space:nowrap;
}
.band-badge.b1{ border-color:var(--coral-dim); color:var(--coral); }
.band-badge.b2{ border-color:var(--amber-dim); color:var(--amber); }
.band-badge.b3{ border-color:var(--cyan-dim); color:var(--cyan); }
.band-badge.b4{ border-color:var(--green-dim); color:var(--green); }
.sa-model{ margin-top:12px; font-size:13.5px; padding:11px 13px; background:var(--panel-2); border:1px solid var(--hair); border-radius:var(--radius-s); display:none; }
.sa-model.show{ display:block; }

/* =========================================================
   DRAG & DROP
   ========================================================= */
.dd-wrap{ padding:18px; }
.dd-tray{ display:flex; flex-wrap:wrap; gap:9px; padding:12px; border:1px dashed var(--hair); border-radius:var(--radius-s); min-height:56px; margin-bottom:16px; background:var(--bg-deep); }
.dd-chip{
  touch-action:none; user-select:none; cursor:grab;
  font-size:13.5px; padding:8px 13px; border-radius:var(--radius-s); background:var(--panel-2);
  border:1px solid var(--cyan-dim); color:var(--ink); box-shadow:0 1px 0 rgba(0,0,0,.2);
}
.dd-chip.dragging{ position:fixed; z-index:200; cursor:grabbing; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.dd-chip.placed{ cursor:default; border-color:var(--green); }
.dd-zones{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.dd-zone{
  border:1px solid var(--hair); border-radius:var(--radius-s); padding:10px; min-height:76px; background:var(--panel-2);
  display:flex; flex-direction:column; gap:6px;
}
.dd-zone-label{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
.dd-zone.over{ border-color:var(--cyan); }
.dd-zone-fill{ display:flex; flex-wrap:wrap; gap:6px; }
@keyframes shake{ 10%,90%{transform:translateX(-1px);} 20%,80%{transform:translateX(2px);} 30%,50%,70%{transform:translateX(-4px);} 40%,60%{transform:translateX(4px);} }
.shake{ animation:shake .4s; }
.dd-status{ margin-top:12px; font-family:var(--font-mono); font-size:12.5px; color:var(--ink-dim); }

/* =========================================================
   SPECIES CARDS
   ========================================================= */
.card-grid{ display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
.flip-card{ perspective:1200px; height:200px; }
.flip-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
.flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
.flip-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-m);
  border:1px solid var(--hair); background:var(--panel-2); padding:12px; display:flex; flex-direction:column;
  cursor:pointer;
}
.flip-face:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }
.flip-front{ align-items:center; justify-content:center; text-align:center; gap:8px; }
.flip-front svg{ width:52px; height:52px; }
.flip-front .fc-name{ font-size:13.5px; font-weight:600; color:var(--ink); }
.flip-front .fc-hint{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); }
.flip-back{ transform:rotateY(180deg); justify-content:flex-start; overflow:auto; }
.flip-back .sp{ font-size:15px; display:block; margin-bottom:6px; }
.flip-back dl{ margin:0; font-size:11.5px; }
.flip-back dt{ color:var(--ink-faint); font-family:var(--font-mono); margin-top:5px; }
.flip-back dd{ margin:0; color:var(--ink); }
.kingdom-tag{ display:inline-block; font-family:var(--font-mono); font-size:10px; padding:2px 7px; border-radius:999px; border:1px solid var(--hair); margin-top:6px; }

/* =========================================================
   SEED SIMULATOR
   ========================================================= */
.seed-tabs{ display:flex; gap:8px; margin-bottom:14px; }
.seed-tab{ flex:1; padding:10px; border-radius:var(--radius-s); border:1px solid var(--hair); background:var(--panel-2); color:var(--ink-dim); cursor:pointer; font-weight:600; font-size:13.5px; }
.seed-tab.active{ border-color:var(--green); color:var(--green); background:rgba(110,231,168,0.07); }
.seed-stage{ display:grid; gap:18px; grid-template-columns:1fr; }
@media(min-width:720px){ .seed-stage{ grid-template-columns:1.1fr .9fr; } }
.seed-svg-box{ background:var(--bg-deep); border:1px solid var(--hair); border-radius:var(--radius-m); padding:10px; display:flex; align-items:center; justify-content:center; min-height:260px; }
.seed-legend{ display:grid; gap:8px; align-content:start; }
.seed-legend .item{ display:flex; align-items:center; gap:8px; font-size:13px; }
.seed-legend .sw{ width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.germ-btn-row{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.part-highlight{ transition:opacity .2s; }

/* =========================================================
   DICHOTOMOUS KEY TOOL
   ========================================================= */
.key-step{ border:1px solid var(--hair); border-radius:var(--radius-s); padding:14px; margin-bottom:10px; background:var(--panel-2); }
.key-step .kq{ font-size:14.5px; margin-bottom:10px; }
.key-choices{ display:flex; gap:10px; flex-wrap:wrap; }
.key-path{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); margin-top:10px; }
.key-path span{ color:var(--cyan); }

/* =========================================================
   TOASTS / MODALS
   ========================================================= */
#toast-zone{ position:fixed; top:16px; right:16px; z-index:500; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.toast{
  background:var(--panel); border:1px solid var(--green-dim); color:var(--ink); font-family:var(--font-mono); font-size:13px;
  padding:9px 14px; border-radius:var(--radius-s); box-shadow:0 6px 18px rgba(0,0,0,.4);
  animation:toastin .25s ease, toastout .35s ease 2.3s forwards;
}
@keyframes toastin{ from{ opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
@keyframes toastout{ to{ opacity:0; transform:translateY(-6px);} }

.modal-overlay{ position:fixed; inset:0; background:rgba(3,10,18,.72); display:flex; align-items:center; justify-content:center; z-index:600; padding:20px; }
.modal-box{ max-width:380px; width:100%; padding:22px; }
.modal-box h3{ font-size:17px; margin-bottom:8px; }
.modal-box p{ font-size:14px; margin-bottom:16px; }
.modal-actions{ display:flex; gap:10px; justify-content:flex-end; }

/* footer */

<script>
/* =========================================================================
   THE BIOLOGICAL BLUEPRINT — QUEST ENGINE
   Vanilla JS, single file. Built for MYP Y9 Discrete Biology.
   ========================================================================= */
(function(){
"use strict";

/* ---------- tiny helpers ---------- */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else if(k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){
    if(c == null) return;
    if(typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}
function h(html){ var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function clamp(n,a,b){ return Math.max(a, Math.min(b,n)); }
function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- persistence ---------- */
var STORE_KEY = 'bioblueprint_progress_v1';
function loadState(){
  var base = {
    xp:0,
    answered:{},      // questionId -> {correct:bool, chosen:idx}
    shortAnswers:{},  // qId -> {band:1-4, hitCount, submitted:true}
    dragdrops:{},     // ddId -> { itemId: zoneId }  (only correct placements stored)
    levelDone:{},     // levelId -> true
    levelPoints:{},   // levelId -> {earned, max}
    flippedCards:{},  // cardId -> true
    bonuses:{},       // one-off exploration bonuses
    certName:''
  };
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){
      var parsed = JSON.parse(raw);
      for(var k in base){ if(parsed[k] !== undefined) base[k] = parsed[k]; }
    }
  }catch(e){ /* storage unavailable — proceed with defaults */ }
  return base;
}
var state = loadState();
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore */ }
}

/* ---------- rank system ---------- */
var RANKS = [
  {min:0,   name:'Field Trainee'},
  {min:90,  name:'Junior Classifier'},
  {min:230, name:'Apprentice Taxonomist'},
  {min:420, name:'Senior Naturalist'},
  {min:620, name:'Master Biologist'},
  {min:800, name:'Blueprint Architect'}
];
function currentRank(xp){
  var r = RANKS[0];
  for(var i=0;i<RANKS.length;i++){ if(xp >= RANKS[i].min) r = RANKS[i]; }
  return r;
}
function nextRankInfo(xp){
  for(var i=0;i<RANKS.length;i++){ if(xp < RANKS[i].min) return RANKS[i]; }
  return null;
}

/* ---------- xp / toast ---------- */
function awardXP(amount, label){
  if(amount <= 0) return;
  state.xp += amount;
  saveState();
  updateHUD();
  toast('+' + amount + ' XP' + (label ? ' · ' + label : ''));
}
function toast(msg){
  var zone = qs('#toast-zone');
  var t = el('div',{class:'toast'},[msg]);
  zone.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2700);
}
function awardOnce(key, amount, label){
  if(state.bonuses[key]) return;
  state.bonuses[key] = true;
  saveState();
  awardXP(amount, label);
}
function updateHUD(){
  qs('#hudXP').textContent = state.xp;
  qs('#hudRank').textContent = currentRank(state.xp).name;
}

/* ---------- custom confirm modal (no native dialogs) ---------- */
function showConfirm(title, msg, onYes){
  var slot = qs('#modal-slot');
  slot.innerHTML = '';
  var box = el('div',{class:'plate panel modal-box'},[]);
  box.appendChild(el('h3',{},[title]));
  box.appendChild(el('p',{},[msg]));
  var actions = el('div',{class:'modal-actions'},[]);
  var cancel = el('button',{class:'btn btn-ghost'},['Cancel']);
  var yes = el('button',{class:'btn btn-primary'},['Confirm']);
  cancel.addEventListener('click', function(){ slot.innerHTML=''; });
  yes.addEventListener('click', function(){ slot.innerHTML=''; onYes(); });
  actions.appendChild(cancel); actions.appendChild(yes);
  box.appendChild(actions);
  var overlay = el('div',{class:'modal-overlay'},[box]);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) slot.innerHTML=''; });
  slot.appendChild(overlay);
  yes.focus();
}

/* ---------- icon library ---------- */
var ICON = {

  trophy: '<svg viewBox="0 0 40 40" fill="none" stroke="#F2B84B" stroke-width="1.6"><path d="M12 8h16v8a8 8 0 0 1-16 0V8z"/><path d="M12 10H7a5 5 0 0 0 5 7M28 10h5a5 5 0 0 1-5 7"/><path d="M20 24v5M14 34h12M16 29h8v5H16z"/></svg>',
  microscope: '<svg viewBox="0 0 40 40" fill="none" stroke="#5AD1FF" stroke-width="1.6"><path d="M14 34h12M20 34v-6M13 28h14M17 22l-2-9 3-1M18 12l6-2 2 3-6 2"/><circle cx="16" cy="24" r="3.4"/><path d="M27 8l3 3-4 4-3-3z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.3 2 5 5.4 5c2 0 3.4 1 4.6 2.6C11.2 6 12.6 5 14.6 5 18 5 19.6 8.3 22 11.8 19.5 16.4 12 21 12 21z"/></svg>',
  paw: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="10" r="2.1"/><circle cx="11" cy="6.5" r="2.1"/><circle cx="16.5" cy="7.5" r="2"/><circle cx="20" cy="12" r="1.9"/><path d="M12 12c3.6 0 6.4 2.5 6.4 5.2 0 1.9-1.6 3.3-3.6 3.3-1.1 0-1.9-.5-2.8-.5-.9 0-1.7.5-2.8.5-2 0-3.6-1.4-3.6-3.3C5.6 14.5 8.4 12 12 12z"/></svg>',
  sprout: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22v-9M12 13c0-4 3-6 7-6 0 4-3 7-7 6zM12 13c0-3-2.5-5-6-5 0 3 2.5 5.5 6 5z"/></svg>',
  cell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.4"/><circle cx="7" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="16" cy="15" r="1" fill="currentColor" stroke="none"/></svg>',
  spiral: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 4a8 8 0 1 1-6 13.2"/><circle cx="12" cy="4" r="1" fill="currentColor" stroke="none"/></svg>',
  rodgroup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16M16 4v16M4 12h16"/></svg>'
};
function iconEl(name, size){ var d = el('span',{html:ICON[name]||''}); d.style.display='inline-flex'; if(size){ d.style.width=size+'px'; d.style.height=size+'px'; } var svg = d.querySelector('svg'); if(svg && size){ svg.setAttribute('width', size); svg.setAttribute('height', size); } return d; }

qs('#brandLogoSlot').appendChild(iconEl('logo', 30));

/* ---------- shared: keyword-band evaluator for short answers ---------- */
function evalShortAnswer(text, concepts){
  var lower = (text||'').toLowerCase();
  var hits = concepts.map(function(c){
    var hit = c.patterns.some(function(p){ return lower.indexOf(p) !== -1; });
    return {label:c.label, hit:hit};
  });
  var hitCount = hits.filter(function(h){ return h.hit; }).length;
  var total = concepts.length;
  var ratio = total ? hitCount/total : 0;
  var band;
  if(ratio <= 0.26) band = {n:1, range:'1–2', name:'Limited', cls:'b1'};
  else if(ratio <= 0.51) band = {n:2, range:'3–4', name:'Developing', cls:'b2'};
  else if(ratio <= 0.76) band = {n:3, range:'5–6', name:'Substantial', cls:'b3'};
  else band = {n:4, range:'7–8', name:'Excellent', cls:'b4'};
  return {hits:hits, hitCount:hitCount, total:total, band:band};
}
var BAND_XP = {1:5, 2:10, 3:15, 4:20};

/* =========================================================================
   GENERIC RENDERERS: MCQ / SHORT ANSWER / DRAG-DROP / FLIP CARDS
   ========================================================================= */
var LETTERS = ['A','B','C','D','E','F'];

function renderMCQ(q, levelId, index){
  var wrap = el('div',{class:'plate q-block'},[]);
  wrap.appendChild(el('span',{class:'rt2'}));
  wrap.appendChild(el('span',{class:'rt3'}));
  var head = el('div',{class:'q-head'},[
    el('div',{},[ el('span',{class:'q-num'},['Question ' + index]), el('div',{class:'q-prompt'},[q.prompt]) ]),
    el('span',{class:'q-xp'},['+' + q.xp + ' XP'])
  ]);
  wrap.appendChild(head);
  var opts = el('div',{class:'opts'},[]);
  var fb = el('div',{class:'q-feedback'},[]);

  var prior = state.answered[q.id];
  function paint(chosenIdx){
    qsa('.opt', opts).forEach(function(btn, i){
      btn.setAttribute('disabled','true');
      if(i === q.correctIndex) btn.classList.add('correct');
      else if(i === chosenIdx) btn.classList.add('wrong');
      else btn.classList.add('dim');
    });
    fb.classList.add('show');
    fb.classList.add(chosenIdx === q.correctIndex ? 'ok' : 'no');
    fb.textContent = (chosenIdx === q.correctIndex ? 'Correct — ' : 'Not quite — ') + q.explain;
  }

  q.options.forEach(function(opt, i){
    var btn = el('button',{class:'opt', type:'button'},[
      el('span',{class:'letter'},[LETTERS[i]]),
      el('span',{},[opt])
    ]);
    btn.addEventListener('click', function(){
      if(state.answered[q.id]) return;
      var correct = (i === q.correctIndex);
      state.answered[q.id] = {correct:correct, chosen:i};
      saveState();
      paint(i);
      if(correct) awardXP(q.xp, 'correct answer');
      else toast('Reviewed — see explanation');
      refreshLevelProgress(levelId);
      refreshHomeIfVisible();
    });
    opts.appendChild(btn);
  });
  wrap.appendChild(opts);
  wrap.appendChild(fb);
  if(prior){ paint(prior.chosen); }
  return wrap;
}

function renderShortAnswer(q, levelId, index){
  var wrap = el('div',{class:'plate q-block sa-wrap'},[]);
  wrap.appendChild(el('span',{class:'rt2'}));
  wrap.appendChild(el('span',{class:'rt3'}));
  wrap.appendChild(el('div',{},[ el('span',{class:'q-num'},['Short answer ' + index]), el('div',{class:'q-prompt'},[q.prompt]) ]));

  var ta = el('textarea',{placeholder:'Type your answer here… watch the keyword tracker light up as you write.'});
  wrap.appendChild(ta);

  var meta = el('div',{class:'sa-meta'},[]);
  var band = el('span',{class:'band-badge'},['Level achieved: —']);
  var submitBtn = el('button',{class:'btn btn-primary btn-sm'},['Submit answer']);
  meta.appendChild(band); meta.appendChild(submitBtn);
  wrap.appendChild(meta);

  var kwRow = el('div',{class:'kw-row'},[]);
  q.concepts.forEach(function(c){ kwRow.appendChild(el('span',{class:'kw-chip'},[c.label])); });
  wrap.appendChild(kwRow);

  var model = el('div',{class:'sa-model'},[el('b',{},['Model concepts to include: ']), document.createTextNode(q.modelHint)]);
  wrap.appendChild(model);

  function refresh(text){
    var res = evalShortAnswer(text, q.concepts);
    qsa('.kw-chip', kwRow).forEach(function(chip, i){
      chip.classList.toggle('hit', res.hits[i].hit);
    });
    band.textContent = 'Level achieved: ' + res.band.range + ' (' + res.band.name + ')';
    band.className = 'band-badge ' + res.band.cls;
    return res;
  }

  var locked = !!(state.shortAnswers[q.id] && state.shortAnswers[q.id].submitted);
  if(locked){
    ta.value = state.shortAnswers[q.id].text || '';
    ta.setAttribute('disabled','true');
    refresh(ta.value);
    submitBtn.textContent = 'Submitted';
    submitBtn.setAttribute('disabled','true');
    model.classList.add('show');
  } else {
    ta.addEventListener('input', function(){ refresh(ta.value); });
    submitBtn.addEventListener('click', function(){
      if(ta.value.trim().length < 12){ toast('Write a little more before submitting'); return; }
      var res = refresh(ta.value);
      state.shortAnswers[q.id] = {band:res.band.n, hitCount:res.hitCount, submitted:true, text: ta.value};
      saveState();
      ta.setAttribute('disabled','true');
      submitBtn.textContent = 'Submitted';
      submitBtn.setAttribute('disabled','true');
      model.classList.add('show');
      awardXP(BAND_XP[res.band.n], 'Level ' + res.band.range + ' response');
      refreshLevelProgress(levelId);
      refreshHomeIfVisible();
    });
  }
  return wrap;
}

/* ---------- drag & drop (pointer-events based, touch + mouse) ---------- */
function renderDragDrop(activity, levelId){
  // activity = {id, title, hint, items:[{id,label}], zones:[{id,label,icon}], answerKey:{itemId:zoneId}}
  var wrap = el('div',{class:'plate dd-wrap'},[]);
  wrap.appendChild(el('span',{class:'rt2'}));
  wrap.appendChild(el('span',{class:'rt3'}));
  wrap.appendChild(el('h3',{},[activity.title]));
  if(activity.hint) wrap.appendChild(el('p',{},[activity.hint]));

  var tray = el('div',{class:'dd-tray'},[]);
  var zonesEl = el('div',{class:'dd-zones'},[]);
  var status = el('div',{class:'dd-status'},[]);

  var placed = state.dragdrops[activity.id] || {}; // itemId -> zoneId (only correct ones stored)

  var zoneFillMap = {};
  activity.zones.forEach(function(z){
    var fill = el('div',{class:'dd-zone-fill'},[]);
    zoneFillMap[z.id] = fill;
    var zoneEl = el('div',{class:'dd-zone', 'data-zone':z.id},[
      el('div',{class:'dd-zone-label'},[z.label]),
      fill
    ]);
    zonesEl.appendChild(zoneEl);
  });

  function makeChip(item, inZone){
    var chip = el('div',{class:'dd-chip' + (inZone ? ' placed' : ''), 'data-item':item.id},[item.label]);
    if(!inZone) attachDrag(chip, item);
    return chip;
  }

  function refreshCounts(){
    var done = Object.keys(placed).length;
    status.textContent = done + ' / ' + activity.items.length + ' placed correctly';
    if(done === activity.items.length){
      status.textContent += '  ·  Set complete';
    }
  }

  // build initial layout: placed items go to their zone (locked), rest go to tray
  activity.items.forEach(function(item){
    if(placed[item.id]){
      zoneFillMap[placed[item.id]].appendChild(makeChip(item, true));
    } else {
      tray.appendChild(makeChip(item, false));
    }
  });
  refreshCounts();

  function attachDrag(chip, item){
    chip.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      var startX = ev.clientX, startY = ev.clientY;
      var rect = chip.getBoundingClientRect();
      var offX = startX - rect.left, offY = startY - rect.top;
      var placeholder = el('div',{class:'dd-chip'}, [item.label]);
      placeholder.style.visibility = 'hidden';
      chip.parentNode.insertBefore(placeholder, chip);
      document.body.appendChild(chip);
      chip.classList.add('dragging');
      chip.style.left = rect.left + 'px';
      chip.style.top = rect.top + 'px';
      chip.style.width = rect.width + 'px';
      chip.style.pointerEvents = 'none';
      try{ chip.setPointerCapture(ev.pointerId); }catch(e){}

      function move(e){
        chip.style.left = (e.clientX - offX) + 'px';
        chip.style.top = (e.clientY - offY) + 'px';
        qsa('.dd-zone', zonesEl).forEach(function(z){ z.classList.remove('over'); });
        var under = document.elementFromPoint(e.clientX, e.clientY);
        var zoneEl = under && under.closest ? under.closest('.dd-zone') : null;
        if(zoneEl) zoneEl.classList.add('over');
      }
      function up(e){
        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
        qsa('.dd-zone', zonesEl).forEach(function(z){ z.classList.remove('over'); });
        chip.classList.remove('dragging');
        var under = document.elementFromPoint(e.clientX, e.clientY);
        var zoneEl = under && under.closest ? under.closest('.dd-zone') : null;
        chip.style.left = ''; chip.style.top = ''; chip.style.width = ''; chip.style.pointerEvents = '';
        if(zoneEl){
          var zoneId = zoneEl.getAttribute('data-zone');
          if(activity.answerKey[item.id] === zoneId){
            placeholder.parentNode.removeChild(placeholder);
            placed[item.id] = zoneId;
            state.dragdrops[activity.id] = placed;
            saveState();
            chip.classList.add('placed');
            zoneFillMap[zoneId].appendChild(chip);
            refreshCounts();
            awardXP(10, 'sorted correctly');
            refreshLevelProgress(levelId);
            refreshHomeIfVisible();
            return;
          } else {
            zoneEl.classList.add('shake');
            setTimeout(function(){ zoneEl.classList.remove('shake'); }, 400);
            toast('Not this group — try again');
          }
        }
        // return to tray
        placeholder.parentNode.replaceChild(chip, placeholder);
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
    });
  }

  wrap.appendChild(el('div',{},[el('div',{class:'dd-zone-label',style:''},['Drag each card into the correct group:'])]));
  wrap.appendChild(tray);
  wrap.appendChild(zonesEl);
  wrap.appendChild(status);
  return wrap;
}

/* ---------- flip card gallery ---------- */
function renderFlipCard(card){
  var flipped = !!state.flippedCards[card.id];
  var outer = el('div',{class:'flip-card' + (flipped ? ' flipped' : '')},[]);
  var inner = el('div',{class:'flip-inner'},[]);

function svgHierarchyLadder(labels, colorA, colorB){

  var out = '<svg viewBox="0 0 340 ' + (n*34+20) + '" width="100%" height="'+(n*34+20)+'">';
  for(var i=0;i<n;i++){
    var y = 16 + i*34;
    var x = 10 + i*24;
    out += '<circle cx="'+(x+10)+'" cy="'+y+'" r="7" fill="none" stroke="'+(i%2?colorB:colorA)+'" stroke-width="1.6"/>';
    out += '<text x="'+(x+28)+'" y="'+(y+4)+'" fill="#EAF3FB" font-family="IBM Plex Sans" font-size="12">'+labels[i]+'</text>';
    if(i < n-1) out += '<line x1="'+(x+10)+'" y1="'+(y+7)+'" x2="'+(x+34)+'" y2="'+(y+27)+'" stroke="#20415e" stroke-width="1.4"/>';
  }
  out += '</svg>';
  return out;
}

   ========================================================================= */
function levelStats(id){
  var def = LEVEL_DEFS[id];
  var earned = 0, max = 0, totalItems = 0, answeredItems = 0;
  def.mcqs.forEach(function(q){
    max += q.xp; totalItems++;
    var a = state.answered[q.id];
    if(a){ answeredItems++; if(a.correct) earned += q.xp; }
  });
  def.shortAnswers.forEach(function(q){
    max += 20; totalItems++;
    var sa = state.shortAnswers[q.id];
    if(sa && sa.submitted){ answeredItems++; earned += BAND_XP[sa.band]; }
  });
  (def.dragdrops||[]).forEach(function(dd){
    dd.items.forEach(function(it){
      max += 10; totalItems++;
      var placed = state.dragdrops[dd.id];
      if(placed && placed[it.id] === dd.answerKey[it.id]){ answeredItems++; earned += 10; }
    });
  });
  var pct = max ? Math.round(earned/max*100) : 0;
  return {earned:earned, max:max, pct:pct, totalItems:totalItems, answeredItems:answeredItems};
}
function starsFor(pct){ if(pct >= 80) return 3; if(pct >= 50) return 2; if(pct > 0) return 1; return 0; }

  LEVELS_META.forEach(function(l,i){ if(l.id===id) idx = i; });
  var nextMeta = LEVELS_META[idx+1];
  var footer = el('div',{style:'display:flex;gap:10px;justify-content:space-between;margin-top:24px;flex-wrap:wrap'},[]);
  var backBtn = el('button',{class:'btn btn-ghost'},['← Back to map']);
  backBtn.addEventListener('click', function(){ location.hash=''; });
  var already = !!state.levelDone[id];
  var doneBtn = el('button',{class:'btn btn-primary'},[ already ? (nextMeta ? 'Continue →' : 'Completed ✓') : (nextMeta ? 'Mark complete & continue →' : 'Mark complete ✓') ]);
  doneBtn.addEventListener('click', function(){
    if(!state.levelDone[id]){
      state.levelDone[id] = true;
      saveState();
      awardXP(15, 'level complete');
      toast(def.title + ' complete!');
      if(id === 'boss') fireConfetti();
    }
    if(nextMeta) location.hash = '#' + nextMeta.id;
    else location.hash = '';
  });
  footer.appendChild(backBtn); footer.appendChild(doneBtn);
  view.appendChild(footer);
}

function renderHome(){
  var view = qs('#view'); view.innerHTML = '';
  var hero = el('div',{class:'plate hero'},[]);
  hero.appendChild(el('span',{class:'rt2'})); hero.appendChild(el('span',{class:'rt3'}));
  hero.appendChild(el('span',{class:'hero-kicker'},['MYP Year 9 · Discrete Biology']));
  hero.appendChild(el('h1',{},['The Biological Blueprint']));
  hero.appendChild(el('p',{class:'lead'},['A field guide from microscopic measurement to the tree of life — classification, naming conventions, kingdoms, plants and animals, one level at a time.']));
  var rank = currentRank(state.xp);
  var nxt = nextRankInfo(state.xp);
  hero.appendChild(el('div',{class:'callout', style:'margin-top:16px;max-width:440px'},[
    el('b',{},[rank.name]), ' · ' + state.xp + ' XP' + (nxt ? ' · ' + (nxt.min - state.xp) + ' XP to ' + nxt.name : ' · top rank reached')
  ]));
  view.appendChild(hero);

  var map = el('div',{class:'plate questmap'},[]);
  map.appendChild(el('span',{class:'rt2'})); map.appendChild(el('span',{class:'rt3'}));
  map.appendChild(el('div',{class:'eyebrow-tag'},[el('span',{class:'dot'}),'Quest map']));
  var row = el('div',{class:'qm-node-row'},[]);
  LEVELS_META.forEach(function(meta, i){
    var prevId = i > 0 ? LEVELS_META[i-1].id : null;
    var locked = prevId ? !state.levelDone[prevId] : false;
    var s = levelStats(meta.id);
    var stars = starsFor(s.pct);
    var node = el('button',{class:'qm-node', type:'button', 'data-locked':locked?'true':'false', 'data-complete':state.levelDone[meta.id]?'true':'false'},[]);
    node.appendChild(el('span',{class:'qm-num mono'},['LEVEL ' + meta.num]));
    node.appendChild(el('div',{class:'qm-icon', html:ICON[meta.icon]||''}));
    node.appendChild(el('div',{class:'qm-title'},[meta.title]));
    node.appendChild(el('div',{class:'qm-sub'},[meta.sub]));
    var starsRow = el('div',{class:'qm-stars'},[]);
    for(var k=0;k<3;k++){ starsRow.appendChild(h(k<stars?ICON.starFull:ICON.starEmpty)); }
    node.appendChild(starsRow);
    if(locked) node.appendChild(el('span',{class:'qm-lock', html:ICON.lock}));
    node.addEventListener('click', function(){ if(this.getAttribute('data-locked')==='true'){ toast('Complete the previous level to unlock this one'); return; } var mid = this.querySelector('.qm-num').textContent; });
    (function(metaRef, lockedRef){
      node.onclick = function(){ if(lockedRef){ toast('Complete the previous level to unlock this one'); return; } location.hash = '#' + metaRef.id; };
    })(meta, locked);
    row.appendChild(node);
  });
  map.appendChild(row);
  view.appendChild(map);
}

function route(){
  var hash = (location.hash || '').replace('#','') || 'home';
  if(LEVEL_DEFS[hash]) renderLevelPage(hash);
  else renderHome();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', route);
qs('#homeBtn').addEventListener('click', function(){
  if(!location.hash || location.hash === '#home' || location.hash === '#') renderHome();
  else location.hash = '';
});
qs('#resetBtn').addEventListener('click', function(){
  showConfirm('Reset all progress?', 'This clears your XP, answers, stars and certificate name on this device. This cannot be undone.', function(){
    state = {xp:0, answered:{}, shortAnswers:{}, dragdrops:{}, levelDone:{}, flippedCards:{}, bonuses:{}, certName:''};
    saveState(); updateHUD();
    if(!location.hash || location.hash === '#home' || location.hash === '#') renderHome();
    else location.hash = '';
    toast('Progress reset');
  });
});

updateHUD();
route();

})();
</script>
</body>
</html>

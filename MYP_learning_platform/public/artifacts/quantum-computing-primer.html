  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #06080f;
    color: #c8d8f0;
    font-family: 'Spectral', serif;
  }

  .app {
    min-height: 100vh;
    background: #06080f;
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(30,60,120,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(10,80,60,0.12) 0%, transparent 50%);
    padding: 0 0 80px 0;
  }

  .header {
    border-bottom: 1px solid rgba(100,160,255,0.12);
    padding: 28px 48px;
    display: flex;
    align-items: baseline;
    gap: 16px;
  }

  .header-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(80,160,255,0.5);
    text-transform: uppercase;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 1px;
    color: #d0e4ff;
  }

  .header h1 em {
    font-style: italic;
    color: #5ab4ff;
  }

  .nav {
    display: flex;
    gap: 0;
    padding: 0 48px;
    border-bottom: 1px solid rgba(100,160,255,0.08);
    overflow-x: auto;
  }

  .nav-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    padding: 14px 20px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: rgba(150,180,220,0.45);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    text-transform: uppercase;
  }

  .nav-btn:hover { color: rgba(150,180,220,0.8); }

  .nav-btn.active {
    color: #5ab4ff;
    border-bottom-color: #5ab4ff;
  }

  .content {
    max-width: 860px;
    margin: 0 auto;
    padding: 52px 48px 0;
  }

  .section-intro {
    margin-bottom: 44px;
  }

  .section-intro .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(80,200,140,0.6);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .section-intro h2 {
    font-size: 30px;
    font-weight: 300;
    line-height: 1.3;
    color: #ddeeff;
    margin-bottom: 14px;
  }

  .section-intro p {
    font-size: 17px;
    line-height: 1.75;
    color: rgba(180,210,240,0.7);
    font-weight: 300;
  }

  /* CARDS */
  .card {
    background: rgba(15,25,50,0.6);
    border: 1px solid rgba(80,130,200,0.12);
    border-radius: 4px;
    padding: 28px 32px;
    margin-bottom: 20px;
  }

  .card h3 {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(80,200,140,0.8);
    margin-bottom: 16px;
  }

  .card p {
    font-size: 16px;
    line-height: 1.75;
    color: rgba(180,210,240,0.75);
    font-weight: 300;
  }

  .card p + p { margin-top: 10px; }

  /* KET NOTATION */
  .ket-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(80,130,200,0.08);
  }

  .ket-row:last-child { border-bottom: none; }

  .ket-symbol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    color: #5ab4ff;
    min-width: 90px;
    letter-spacing: 1px;
  }

  .ket-meaning {
    font-size: 15px;
    color: rgba(180,210,240,0.65);
    font-weight: 300;
  }

  .ket-note {
    font-size: 13px;
    font-style: italic;
    color: rgba(130,180,240,0.45);
    margin-top: 3px;
  }

  /* CODE BLOCK */
  .code-block {
    background: rgba(5,10,25,0.9);
    border: 1px solid rgba(80,130,200,0.15);
    border-left: 3px solid #5ab4ff;
    border-radius: 0 4px 4px 0;
    padding: 20px 24px;
    margin: 20px 0;
    overflow-x: auto;
  }

  .code-block pre {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.85;
    color: #b8d4f0;
  }

  .code-comment { color: rgba(100,160,100,0.6); }
  .code-keyword { color: #ff9f7a; }
  .code-string { color: #7affa0; }
  .code-number { color: #ffda7a; }
  .code-fn { color: #a0c8ff; }

  /* GATE DISPLAY */
  .gate-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-top: 8px;
  }

  .gate-card {
    background: rgba(10,18,40,0.8);
    border: 1px solid rgba(80,130,200,0.12);
    border-radius: 4px;
    padding: 20px 22px;
    cursor: pointer;
    transition: all 0.25s;
  }

  .gate-card:hover {
    border-color: rgba(90,180,255,0.3);
    background: rgba(15,28,60,0.9);
  }

  .gate-card.selected {
    border-color: rgba(90,180,255,0.5);
    background: rgba(15,30,70,0.95);
  }

  .gate-symbol {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    background: rgba(90,180,255,0.15);
    border: 1px solid rgba(90,180,255,0.3);
    border-radius: 3px;
    width: 36px;
    height: 36px;
    line-height: 36px;
    text-align: center;
    margin-bottom: 10px;
  }

  .gate-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(80,200,140,0.7);
    margin-bottom: 8px;
  }

  .gate-desc {
    font-size: 14px;
    line-height: 1.6;
    color: rgba(160,200,240,0.65);
    font-weight: 300;
  }

  .gate-detail {
    margin-top: 20px;
    background: rgba(5,12,30,0.7);
    border: 1px solid rgba(90,180,255,0.18);
    border-radius: 4px;
    padding: 22px 26px;
  }

  .gate-detail h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    color: #5ab4ff;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  /* CIRCUIT VISUAL */
  .circuit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    line-height: 2.2;
    color: #b0d0f0;
    padding: 16px 0 8px;
    overflow-x: auto;
  }

  .circuit .qubit-label { color: rgba(80,200,140,0.7); }
  .circuit .gate-box {
    display: inline-block;
    background: rgba(90,180,255,0.12);
    border: 1px solid rgba(90,180,255,0.35);
    border-radius: 2px;
    padding: 0 6px;
    color: #fff;
  }

  .circuit .wire { color: rgba(100,140,200,0.4); }
  .circuit .measure {
    display: inline-block;
    background: rgba(200,100,80,0.12);
    border: 1px solid rgba(200,120,80,0.35);
    border-radius: 2px;
    padding: 0 6px;
    color: #ffaa88;
  }

  /* BLOCH */
  .bloch-container {
    display: flex;
    gap: 32px;
    align-items: flex-start;
    margin-top: 8px;
  }

  .bloch-svg-wrap {
    flex-shrink: 0;
  }

  .bloch-states {
    flex: 1;
  }

  .bloch-state-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(80,130,200,0.08);
    cursor: pointer;
    transition: all 0.2s;
  }

  .bloch-state-row:hover { background: rgba(30,60,120,0.15); }
  .bloch-state-row:last-child { border-bottom: none; }

  .bloch-state-row.active { background: rgba(30,60,120,0.25); }

  .bloch-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .bloch-ket {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #5ab4ff;
    min-width: 50px;
  }

  .bloch-info {
    font-size: 13px;
    color: rgba(160,200,240,0.6);
    font-weight: 300;
  }

  /* UNCERTAINTY TABLE */
  .u-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    margin-top: 8px;
  }

  .u-table th {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(80,200,140,0.6);
    padding: 12px 16px;
    border-bottom: 1px solid rgba(80,130,200,0.15);
    text-align: left;
  }

  .u-table td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(80,130,200,0.06);
    color: rgba(180,210,240,0.7);
    font-weight: 300;
  }

  .u-table tr:last-child td { border-bottom: none; }

  .certain { color: #7affa0; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .uncertain { color: #ffaa88; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .ket-inline { font-family: 'JetBrains Mono', monospace; color: #5ab4ff; }

  /* HISTOGRAM */
  .histogram {
    display: flex;
    gap: 4px;
    align-items: flex-end;
    height: 80px;
    margin: 16px 0 8px;
  }

  .hist-bar {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }

  .hist-fill {
    width: 100%;
    border-radius: 2px 2px 0 0;
    transition: height 0.6s ease;
  }

  .hist-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(150,190,230,0.6);
  }

  /* CALLOUT */
  .callout {
    background: rgba(10,50,30,0.3);
    border: 1px solid rgba(80,200,140,0.2);
    border-left: 3px solid rgba(80,200,140,0.5);
    border-radius: 0 4px 4px 0;
    padding: 16px 20px;
    margin: 20px 0;
    font-size: 15px;
    line-height: 1.7;
    color: rgba(160,230,190,0.75);
    font-style: italic;
    font-weight: 300;
  }

  .callout strong {
    font-style: normal;
    font-weight: 600;
    color: rgba(100,230,150,0.9);
  }

  /* STEP FLOW */
  .steps { margin-top: 8px; }

  .step {
    display: flex;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px solid rgba(80,130,200,0.07);
  }

  .step:last-child { border-bottom: none; }

  .step-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: rgba(90,180,255,0.4);
    min-width: 24px;
    padding-top: 3px;
  }

  .step-body h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: #5ab4ff;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .step-body p {
    font-size: 14px;
    line-height: 1.65;
    color: rgba(160,200,240,0.65);
